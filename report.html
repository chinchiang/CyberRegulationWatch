<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cyber Regulation Watch weekly report">
    <meta name="theme-color" content="#ffffff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>Weekly Brief · Cyber Regulation Watch</title>
    <link rel="icon" href="assets/sentinel.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/report.js" defer></script>
  </head>
  <body class="report-page">
    <a class="skip-link" href="#report-content">跳至週報內容</a>
    <div class="ambient ambient-a" aria-hidden="true"></div>

    <header class="site-header report-header">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">CR</span>
        <span>
          <strong>Cyber Regulation Watch</strong>
          <small>Weekly Executive &amp; Action Brief</small>
        </span>
      </a>
      <a class="button button-ghost compact" href="index.html">← 返回儀表板</a>
    </header>

    <main class="report-shell">
      <section id="report-hero" class="report-hero" aria-live="polite">
        <p class="eyebrow">CYBER REGULATION WATCH</p>
        <h1>載入週報中…</h1>
      </section>

      <div class="report-layout">
        <aside class="report-sidebar" aria-label="Report metadata">
          <div id="report-meta" class="meta-card"></div>
          <nav id="report-toc" class="toc" aria-label="Table of contents"></nav>
        </aside>
        <article id="report-content" class="prose" aria-live="polite">
          <p class="loading">正在讀取已查證內容…</p>
        </article>
      </div>
    </main>

    <footer class="site-footer shell">
      <div><strong>Cyber Regulation Watch</strong><span>Evidence → Impact → Action</span></div>
      <p>Asia/Taipei · MON 08:00</p>
    </footer>
